name: pylint checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pylint:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Install dependencies
      run: uv sync --frozen
    - name: Run pylint on dftimewolf and tests
      run: |
        uv run pylint --rcfile=.pylintrc tests
        uv run pylint --rcfile=.pylintrc dftimewolf
